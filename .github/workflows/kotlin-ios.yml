name: Kotlin iOS Build

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/kt/**'
      - '.github/workflows/kotlin-ios.yml'
  pull_request:
    paths:
      - 'apps/kt/**'
      - '.github/workflows/kotlin-ios.yml'
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: Upload IPA to App Store Connect
        required: false
        default: true
        type: boolean

concurrency:
  group: kotlin-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build iPhone app (Simulator)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/kt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v5 uses Node 24; v4 triggers Node 20 deprecation warnings on current runners.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Configure Auth0 for iOS build
        run: |
          if [ -n "${WEIR_HERE_AUTH0_DOMAIN:-}" ] && [ -n "${WEIR_HERE_AUTH0_CLIENT_ID:-}" ]; then
            printf '%s\n' \
              "weir_here.auth0.domain=${WEIR_HERE_AUTH0_DOMAIN}" \
              "weir_here.auth0.clientId=${WEIR_HERE_AUTH0_CLIENT_ID}" \
              "weir_here.auth0.audience=${WEIR_HERE_AUTH0_AUDIENCE:-}" \
              >> local.properties
          fi
          if [ -n "${WEIR_HERE_API_URL:-}" ]; then
            printf '%s\n' "weir_here.api.url=${WEIR_HERE_API_URL}" >> local.properties
          fi
        env:
          WEIR_HERE_AUTH0_DOMAIN: ${{ secrets.WEIR_HERE_AUTH0_DOMAIN }}
          WEIR_HERE_AUTH0_CLIENT_ID: ${{ secrets.WEIR_HERE_AUTH0_CLIENT_ID }}
          WEIR_HERE_AUTH0_AUDIENCE: ${{ secrets.WEIR_HERE_AUTH0_AUDIENCE }}
          WEIR_HERE_API_URL: ${{ secrets.WEIR_HERE_API_URL }}

      - name: Build shared Kotlin framework (iOS Simulator)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Build iOS app (Simulator)
        run: |
          set -euo pipefail
          DERIVED_DATA="$PWD/iosApp/build/DerivedData"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Stage Simulator app for upload
        id: app
        run: |
          set -euo pipefail
          APP_PATH=$(find iosApp/build/DerivedData -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "iOS .app bundle not found after xcodebuild"
            find iosApp/build -type d -name '*.app' || true
            exit 1
          fi
          STAGING_DIR="${GITHUB_WORKSPACE}/apps/kt/iosApp/build/ci-artifacts"
          STAGED_APP="${STAGING_DIR}/WeirHere-ios-simulator.app"
          rm -rf "$STAGED_APP"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGED_APP"
          echo "path=${STAGED_APP}" >> "$GITHUB_OUTPUT"
          echo "Built: $APP_PATH"
          echo "Staged: $STAGED_APP"

      - name: Upload Simulator app artifact
        uses: actions/upload-artifact@v5
        with:
          name: weir-here-ios-simulator-${{ github.sha }}
          path: ${{ steps.app.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Capture App Store screenshots
        run: |
          set -euo pipefail
          chmod +x iosApp/scripts/capture-app-store-screenshots.sh
          iosApp/scripts/capture-app-store-screenshots.sh \
            "${{ steps.app.outputs.path }}" \
            iosApp/build/screenshots

      - name: Upload App Store screenshots
        uses: actions/upload-artifact@v5
        with:
          name: weir-here-ios-screenshots-${{ github.sha }}
          path: apps/kt/iosApp/build/screenshots/*.png
          if-no-files-found: error
          retention-days: 30

  build-ios-release:
    name: Build & upload to App Store Connect
    needs: build-ios-simulator
    if: >
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.upload_to_app_store != false)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/kt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Validate Apple signing secrets
        run: |
          missing=0
          for key in APPLE_KEY_ID APPLE_ISSUER_ID APPLE_PRIVATE_KEY IOS_DEVELOPMENT_TEAM; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}

      - name: Configure release build properties
        run: |
          printf '%s\n' \
            "weir_here.api.url=${WEIR_HERE_API_URL:-https://www.weirheresolutions.com}" \
            > local.properties
          if [ -n "${WEIR_HERE_AUTH0_DOMAIN:-}" ] && [ -n "${WEIR_HERE_AUTH0_CLIENT_ID:-}" ]; then
            printf '%s\n' \
              "weir_here.auth0.domain=${WEIR_HERE_AUTH0_DOMAIN}" \
              "weir_here.auth0.clientId=${WEIR_HERE_AUTH0_CLIENT_ID}" \
              "weir_here.auth0.audience=${WEIR_HERE_AUTH0_AUDIENCE:-}" \
              >> local.properties
          fi
        env:
          WEIR_HERE_API_URL: ${{ secrets.WEIR_HERE_API_URL }}
          WEIR_HERE_AUTH0_DOMAIN: ${{ secrets.WEIR_HERE_AUTH0_DOMAIN }}
          WEIR_HERE_AUTH0_CLIENT_ID: ${{ secrets.WEIR_HERE_AUTH0_CLIENT_ID }}
          WEIR_HERE_AUTH0_AUDIENCE: ${{ secrets.WEIR_HERE_AUTH0_AUDIENCE }}

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${APPLE_KEY_ID}.p8"
          printf '%s\n' "$APPLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "APP_STORE_CONNECT_API_KEY_KEY=$KEY_FILE" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_API_KEY_KEY_ID=$APPLE_KEY_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=$APPLE_ISSUER_ID" >> "$GITHUB_ENV"
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}

      - name: Archive iOS app (Release)
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$PWD/iosApp/build/WeirHere.xcarchive"
          rm -rf "$ARCHIVE_PATH"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic \
            archive
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$PWD/iosApp/build/WeirHere.xcarchive"
          EXPORT_DIR="$PWD/iosApp/build/export"
          EXPORT_PLIST="$PWD/iosApp/build/ExportOptions.plist"
          rm -rf "$EXPORT_DIR"
          cat > "$EXPORT_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${IOS_DEVELOPMENT_TEAM}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"
          IPA_PATH=$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found after export"
            ls -la "$EXPORT_DIR" || true
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}

      - name: Upload IPA to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPLE_KEY_ID" \
            --apiIssuer "$APPLE_ISSUER_ID"
          echo "Uploaded to App Store Connect. Processing usually takes 5–15 minutes before the build appears in TestFlight / App Store Connect."
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}

      - name: Download App Store screenshots
        uses: actions/download-artifact@v5
        with:
          name: weir-here-ios-screenshots-${{ github.sha }}
          path: apps/kt/iosApp/build/screenshots

      - name: Upload screenshots to App Store Connect
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyJWT cryptography
          python3 iosApp/scripts/upload-app-store-screenshots.py \
            --screenshots-dir iosApp/build/screenshots \
            --bundle-id com.weirhere.mobile \
            --locale "${ASC_SCREENSHOT_LOCALE:-en-US}" \
            --key-id "$APPLE_KEY_ID" \
            --issuer-id "$APPLE_ISSUER_ID" \
            --private-key-path "$HOME/private_keys/AuthKey_${APPLE_KEY_ID}.p8"
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          ASC_SCREENSHOT_LOCALE: ${{ vars.ASC_SCREENSHOT_LOCALE }}

      - name: Upload release IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: weir-here-ios-release-${{ github.sha }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload App Store screenshots (release artifact)
        uses: actions/upload-artifact@v5
        with:
          name: weir-here-ios-screenshots-release-${{ github.sha }}
          path: apps/kt/iosApp/build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
