name: Kotlin iOS Build

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/kt/**'
      - '.github/workflows/kotlin-ios.yml'
  pull_request:
    paths:
      - 'apps/kt/**'
      - '.github/workflows/kotlin-ios.yml'
  workflow_dispatch:

concurrency:
  group: kotlin-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build iPhone app (Simulator)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/kt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v5 uses Node 24; v4 triggers Node 20 deprecation warnings on current runners.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Build shared Kotlin framework (iOS Simulator)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Build iOS app (Simulator)
        run: |
          set -euo pipefail
          DERIVED_DATA="$PWD/iosApp/build/DerivedData"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Stage Simulator app for upload
        id: app
        run: |
          set -euo pipefail
          APP_PATH=$(find iosApp/build/DerivedData -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "iOS .app bundle not found after xcodebuild"
            find iosApp/build -type d -name '*.app' || true
            exit 1
          fi
          STAGING_DIR="${GITHUB_WORKSPACE}/apps/kt/iosApp/build/ci-artifacts"
          STAGED_APP="${STAGING_DIR}/WeirHere-ios-simulator.app"
          rm -rf "$STAGED_APP"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGED_APP"
          echo "path=${STAGED_APP}" >> "$GITHUB_OUTPUT"
          echo "Built: $APP_PATH"
          echo "Staged: $STAGED_APP"

      - name: Upload Simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: weir-here-ios-simulator-${{ github.sha }}
          path: ${{ steps.app.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  # Optional device/IPA job — enable after adding Apple signing secrets to the repo:
  #   IOS_DEVELOPMENT_TEAM, IOS_DISTRIBUTION_CERTIFICATE_P12, IOS_DISTRIBUTION_CERTIFICATE_PASSWORD,
  #   IOS_PROVISIONING_PROFILE_BASE64
