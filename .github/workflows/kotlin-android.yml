name: Kotlin Android Build

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/kt/**'
      - '.github/workflows/kotlin-android.yml'
  pull_request:
    paths:
      - 'apps/kt/**'
      - '.github/workflows/kotlin-android.yml'
  workflow_dispatch:
    inputs:
      upload_to_play_store:
        description: Upload AAB to Google Play Console
        required: false
        default: true
        type: boolean
      play_track:
        description: Play Console track (internal, alpha, beta, production)
        required: false
        default: internal
        type: string

concurrency:
  group: kotlin-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Build Android app (Debug)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Configure Auth0 / API for Android build
        run: |
          : > local.properties
          if [ -n "${WEIR_HERE_AUTH0_DOMAIN:-}" ] && [ -n "${WEIR_HERE_AUTH0_CLIENT_ID:-}" ]; then
            printf '%s\n' \
              "weir_here.auth0.domain=${WEIR_HERE_AUTH0_DOMAIN}" \
              "weir_here.auth0.clientId=${WEIR_HERE_AUTH0_CLIENT_ID}" \
              "weir_here.auth0.audience=${WEIR_HERE_AUTH0_AUDIENCE:-}" \
              >> local.properties
          fi
          if [ -n "${WEIR_HERE_API_URL:-}" ]; then
            printf '%s\n' "weir_here.api.url=${WEIR_HERE_API_URL}" >> local.properties
          else
            printf '%s\n' "weir_here.api.url=https://www.weirheresolutions.com" >> local.properties
          fi
        env:
          WEIR_HERE_AUTH0_DOMAIN: ${{ secrets.WEIR_HERE_AUTH0_DOMAIN }}
          WEIR_HERE_AUTH0_CLIENT_ID: ${{ secrets.WEIR_HERE_AUTH0_CLIENT_ID }}
          WEIR_HERE_AUTH0_AUDIENCE: ${{ secrets.WEIR_HERE_AUTH0_AUDIENCE }}
          WEIR_HERE_API_URL: ${{ secrets.WEIR_HERE_API_URL }}

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

  build-android-release:
    name: Build Android app (Release AAB)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Configure Auth0 / API for Android build
        run: |
          : > local.properties
          if [ -n "${WEIR_HERE_AUTH0_DOMAIN:-}" ] && [ -n "${WEIR_HERE_AUTH0_CLIENT_ID:-}" ]; then
            printf '%s\n' \
              "weir_here.auth0.domain=${WEIR_HERE_AUTH0_DOMAIN}" \
              "weir_here.auth0.clientId=${WEIR_HERE_AUTH0_CLIENT_ID}" \
              "weir_here.auth0.audience=${WEIR_HERE_AUTH0_AUDIENCE:-}" \
              >> local.properties
          fi
          if [ -n "${WEIR_HERE_API_URL:-}" ]; then
            printf '%s\n' "weir_here.api.url=${WEIR_HERE_API_URL}" >> local.properties
          else
            printf '%s\n' "weir_here.api.url=https://www.weirheresolutions.com" >> local.properties
          fi
        env:
          WEIR_HERE_AUTH0_DOMAIN: ${{ secrets.WEIR_HERE_AUTH0_DOMAIN }}
          WEIR_HERE_AUTH0_CLIENT_ID: ${{ secrets.WEIR_HERE_AUTH0_CLIENT_ID }}
          WEIR_HERE_AUTH0_AUDIENCE: ${{ secrets.WEIR_HERE_AUTH0_AUDIENCE }}
          WEIR_HERE_API_URL: ${{ secrets.WEIR_HERE_API_URL }}

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing GitHub secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          KEYSTORE_PATH="$PWD/ci-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Keep above manually published versionCodes (currently 4).
          VERSION_CODE: ${{ github.run_number + 1000 }}
          VERSION_NAME: "4.${{ github.run_number }}"
        run: |
          set -euo pipefail
          missing=0
          for key in ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required env/secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          ./gradlew :androidApp:bundleRelease --no-daemon --stacktrace

      - name: Locate AAB
        id: aab
        run: |
          set -euo pipefail
          AAB_PATH=$(find "$PWD/androidApp/build/outputs/bundle/release" -name '*.aab' -print -quit)
          if [ -z "$AAB_PATH" ]; then
            echo "Release AAB not found"
            find "$PWD/androidApp/build/outputs" -type f || true
            exit 1
          fi
          echo "path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "Built AAB: $AAB_PATH"
          ls -lh "$AAB_PATH"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v5
        with:
          name: weir-here-android-release-${{ github.sha }}
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  upload-play-store:
    name: Upload to Google Play
    needs: build-android-release
    if: >
      needs.build-android-release.result == 'success' &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.upload_to_play_store != false))
    runs-on: ubuntu-latest

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v5
        with:
          name: weir-here-android-release-${{ github.sha }}
          path: play-upload

      - name: Validate Play Store secrets
        run: |
          if [ -z "${PLAY_STORE_JSON_KEY:-}" ]; then
            echo "::error::Missing GitHub secret PLAY_STORE_JSON_KEY"
            exit 1
          fi
          AAB_PATH=$(find play-upload -name '*.aab' -print -quit)
          if [ -z "$AAB_PATH" ]; then
            echo "::error::Downloaded AAB not found"
            find play-upload -type f || true
            exit 1
          fi
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Resolve Play track
        id: track
        run: |
          TRACK="${{ github.event.inputs.play_track }}"
          if [ -z "$TRACK" ]; then
            TRACK="internal"
          fi
          echo "value=$TRACK" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.weirhere.mobile
          releaseFiles: ${{ env.AAB_PATH }}
          tracks: ${{ steps.track.outputs.value }}
          status: completed
